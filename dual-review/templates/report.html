<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #f5f7fa;
  --surface: #ffffff;
  --surface-2: #eef1f5;
  --ink: #1b212c;
  --ink-2: #4a5364;
  --muted: #76809a;
  --line: #dde2ea;
  --line-strong: #c3cad7;
  --accent: #2c6e8e;
  --code-bg: #eef1f5;
  --sev-blocker-bg: #fbe4e1; --sev-blocker-fg: #8f1d15; --sev-blocker-line: #d5463a;
  --sev-major-bg: #fbeed3;   --sev-major-fg: #7a4f00;   --sev-major-line: #d9991a;
  --sev-minor-bg: #e1ecfa;   --sev-minor-fg: #1d4f8c;   --sev-minor-line: #4a86d6;
  --sev-nit-bg: #e9ecf1;     --sev-nit-fg: #4a5364;     --sev-nit-line: #9aa4b5;
  --sev-unclassified-bg: #e9ecf1; --sev-unclassified-fg: #4a5364; --sev-unclassified-line: #9aa4b5;
  --src-confirmed-bg: #deefe4; --src-confirmed-fg: #175f34; --src-confirmed-line: transparent;
  --src-disputed-bg: #ece3f8;  --src-disputed-fg: #5b358f;  --src-disputed-line: transparent;
  --src-neutral-bg: transparent; --src-neutral-fg: #4a5364; --src-neutral-line: #c3cad7;
  --font-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #12151b;
    --surface: #1a1f27;
    --surface-2: #222833;
    --ink: #e6e9ef;
    --ink-2: #b3bac6;
    --muted: #7f8899;
    --line: #2a313c;
    --line-strong: #3a4250;
    --accent: #6fb3d2;
    --code-bg: #222833;
    --sev-blocker-bg: #3a1a17; --sev-blocker-fg: #f5a39a; --sev-blocker-line: #d5463a;
    --sev-major-bg: #3a2c10;   --sev-major-fg: #f2c66d;   --sev-major-line: #d9991a;
    --sev-minor-bg: #16283f;   --sev-minor-fg: #8fbcf0;   --sev-minor-line: #4a86d6;
    --sev-nit-bg: #262c36;     --sev-nit-fg: #b3bac6;     --sev-nit-line: #6c7788;
    --sev-unclassified-bg: #262c36; --sev-unclassified-fg: #b3bac6; --sev-unclassified-line: #6c7788;
    --src-confirmed-bg: #14301f; --src-confirmed-fg: #7dd3a0;
    --src-disputed-bg: #2a1f3d;  --src-disputed-fg: #c9a6f0;
    --src-neutral-fg: #b3bac6; --src-neutral-line: #3a4250;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #12151b;
  --surface: #1a1f27;
  --surface-2: #222833;
  --ink: #e6e9ef;
  --ink-2: #b3bac6;
  --muted: #7f8899;
  --line: #2a313c;
  --line-strong: #3a4250;
  --accent: #6fb3d2;
  --code-bg: #222833;
  --sev-blocker-bg: #3a1a17; --sev-blocker-fg: #f5a39a; --sev-blocker-line: #d5463a;
  --sev-major-bg: #3a2c10;   --sev-major-fg: #f2c66d;   --sev-major-line: #d9991a;
  --sev-minor-bg: #16283f;   --sev-minor-fg: #8fbcf0;   --sev-minor-line: #4a86d6;
  --sev-nit-bg: #262c36;     --sev-nit-fg: #b3bac6;     --sev-nit-line: #6c7788;
  --sev-unclassified-bg: #262c36; --sev-unclassified-fg: #b3bac6; --sev-unclassified-line: #6c7788;
  --src-confirmed-bg: #14301f; --src-confirmed-fg: #7dd3a0;
  --src-disputed-bg: #2a1f3d;  --src-disputed-fg: #c9a6f0;
  --src-neutral-fg: #b3bac6; --src-neutral-line: #3a4250;
}

body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
code, .mono { font-family: var(--font-mono); }
code { font-size: 0.9em; background: var(--code-bg); padding: 1px 5px; border-radius: 3px; }

.page { max-width: 920px; margin: 0 auto; padding: 40px 24px 64px; }

.eyebrow { font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; margin: 6px 0 20px; text-wrap: balance; }
h1 .num { color: var(--muted); font-weight: 500; }
.title-sub { font-size: 16px; color: var(--ink-2); font-weight: 400; display: block; margin-top: 4px; }

.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px 28px; margin: 0; padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.meta > div { min-width: 0; }
.meta dt { font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.meta dd { margin: 3px 0 0; font-size: 14px; color: var(--ink); overflow-wrap: anywhere; }
.meta dd .mono { font-size: 13px; color: var(--ink-2); }

.notice { margin: 20px 0 0; padding: 10px 14px; border-radius: 4px; background: var(--sev-major-bg); color: var(--sev-major-fg); font-size: 14px; }

.summary { font-size: 17px; line-height: 1.6; max-width: 65ch; margin: 28px 0 24px; }

.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--sev-line); border-radius: 5px; padding: 14px 16px 12px; }
.tile .n { font-size: 30px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.tile.zero .n { color: var(--muted); font-weight: 500; }
.tile .l { margin-top: 8px; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
@media (max-width: 640px) { .tiles { grid-template-columns: repeat(2, 1fr); } }

.agreement { display: flex; flex-wrap: wrap; gap: 8px 10px; margin: 14px 0 0; padding: 0; list-style: none; }
.agreement li { display: inline-flex; align-items: baseline; gap: 6px; font-size: 13px; color: var(--ink-2); padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.agreement li b { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }

h2 { display: flex; align-items: baseline; gap: 10px; margin: 40px 0 12px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h2 .count { font-weight: 500; font-variant-numeric: tabular-nums; }
h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.findings { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.finding { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--sev-line); border-radius: 4px; padding: 14px 18px 16px; min-width: 0; }
.finding header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 10px; }
.finding h3 { flex: 1 1 260px; margin: 0; font-size: 16px; font-weight: 600; line-height: 1.35; text-wrap: balance; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; line-height: 1.5; padding: 2px 7px; border-radius: 3px; white-space: nowrap; }
.badge.sev { background: var(--sev-bg); color: var(--sev-fg); }
.badge.src { background: var(--src-bg); color: var(--src-fg); border: 1px solid var(--src-line); }
.loc { margin-top: 8px; font-family: var(--font-mono); font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.detail { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 10px 0 0; font-size: 14px; }
.detail dt { color: var(--muted); font-weight: 500; }
.detail dd { margin: 0; max-width: 72ch; }
@media (max-width: 560px) { .detail { grid-template-columns: 1fr; gap: 2px; } .detail dd { margin-bottom: 6px; } }

.sev-blocker { --sev-bg: var(--sev-blocker-bg); --sev-fg: var(--sev-blocker-fg); --sev-line: var(--sev-blocker-line); }
.sev-major { --sev-bg: var(--sev-major-bg); --sev-fg: var(--sev-major-fg); --sev-line: var(--sev-major-line); }
.sev-minor { --sev-bg: var(--sev-minor-bg); --sev-fg: var(--sev-minor-fg); --sev-line: var(--sev-minor-line); }
.sev-nit { --sev-bg: var(--sev-nit-bg); --sev-fg: var(--sev-nit-fg); --sev-line: var(--sev-nit-line); }
.sev-unclassified { --sev-bg: var(--sev-unclassified-bg); --sev-fg: var(--sev-unclassified-fg); --sev-line: var(--sev-unclassified-line); }
.src-confirmed { --src-bg: var(--src-confirmed-bg); --src-fg: var(--src-confirmed-fg); --src-line: var(--src-confirmed-line); }
.src-disputed { --src-bg: var(--src-disputed-bg); --src-fg: var(--src-disputed-fg); --src-line: var(--src-disputed-line); }
.src-claude-only, .src-gpt-only, .src-already-raised, .src-unknown { --src-bg: var(--src-neutral-bg); --src-fg: var(--src-neutral-fg); --src-line: var(--src-neutral-line); }

.empty { background: var(--surface); border: 1px dashed var(--line-strong); border-radius: 4px; padding: 22px; text-align: center; color: var(--ink-2); }

details { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; margin-top: 10px; }
details + details { margin-top: 10px; }
summary { cursor: pointer; padding: 12px 16px; font-weight: 500; list-style: none; display: flex; align-items: baseline; gap: 10px; }
summary::-webkit-details-marker { display: none; }
summary .count { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
summary::after { content: "+"; margin-left: auto; color: var(--muted); font-family: var(--font-mono); }
details[open] summary::after { content: "−"; }
.details-body { padding: 4px 18px 18px; border-top: 1px solid var(--line); }
.details-body .findings { margin-top: 14px; }
.details-body .finding { opacity: 0.85; }

.md { max-width: 75ch; font-size: 14px; }
.md h3, .md h4, .md h5, .md h6 { margin: 18px 0 6px; font-weight: 600; line-height: 1.3; }
.md h3 { font-size: 17px; } .md h4 { font-size: 15px; } .md h5 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-2); } .md h6 { font-size: 14px; }
.md p { margin: 8px 0; }
.md ul { margin: 6px 0; padding-left: 22px; }
.md li { margin: 3px 0; }
.md pre { overflow-x: auto; background: var(--code-bg); padding: 12px 14px; border-radius: 4px; font-size: 13px; line-height: 1.5; }
.md pre code { background: none; padding: 0; font-size: inherit; }

.files { columns: 2; column-gap: 28px; margin: 12px 0 0; padding: 0; list-style: none; font-family: var(--font-mono); font-size: 13px; color: var(--ink-2); }
.files li { break-inside: avoid; overflow-wrap: anywhere; padding: 2px 0; }
@media (max-width: 640px) { .files { columns: 1; } }

.foot { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; line-height: 1.7; overflow-wrap: anywhere; }
.foot code { font-size: 12px; }

@media (prefers-reduced-motion: no-preference) { details summary::after { transition: color 120ms; } }
</style>
<div class="page">
{{CONTENT}}
</div>
